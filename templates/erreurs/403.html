{% extends 'base.html' %}
{% load static %}

<!-- Template: Erreur 403 - Accès Interdit -->
<!-- Page d'erreur 403 - Accès non autorisé -->

{% block title %}403 - Accès Interdit{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center my-5">
        <div class="col-md-6 text-center">
            <div style="font-size: 4rem; color: #dc3545; margin-bottom: 20px;">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h1 class="display-4 text-danger">403</h1>
            <p class="h4 mb-4">Accès Interdit</p>
            <p class="text-muted mb-4">
                Vous n'avez pas les permissions nécessaires pour accéder à cette ressource.
            </p>
            <a href="{% url 'dashboard:accueil' %}" class="btn btn-primary">
                <i class="bi bi-house"></i> Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
