{% extends 'base.html' %}
{% load static %}

<!-- Template: Erreur 404 - Page Non Trouvée -->
<!-- Page d'erreur 404 - Ressource non trouvée -->

{% block title %}404 - Page Non Trouvée{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center my-5">
        <div class="col-md-6 text-center">
            <div style="font-size: 4rem; color: #ffc107; margin-bottom: 20px;">
                <i class="bi bi-question-circle"></i>
            </div>
            <h1 class="display-4 text-warning">404</h1>
            <p class="h4 mb-4">Page Non Trouvée</p>
            <p class="text-muted mb-4">
                La ressource que vous recherchez n'existe pas ou a été déplacée.
            </p>
            <a href="{% url 'dashboard:accueil' %}" class="btn btn-primary">
                <i class="bi bi-house"></i> Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
