<!-- Sidebar - Menu de navigation latéral -->
<!-- Navigation principale vers les différents modules de l'application -->

<aside class="col-md-3 col-lg-2 d-none d-md-block bg-white sidebar py-4">
    <div class="position-sticky top-0 px-3">
        <div class="mb-4 px-3">
            <span class="badge bg-success text-white rounded-pill px-3 py-2">Navigation</span>
        </div>
        <nav class="nav nav-pills flex-column gap-1">
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'dashboard' %}active{% else %}text-secondary{% endif %}" href="{% url 'dashboard:accueil' %}">
                <i class="bi bi-speedometer2 me-2"></i> Tableau de Bord
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'exploitation' %}active{% else %}text-secondary{% endif %}" href="{% url 'exploitation:liste' %}">
                <i class="bi bi-building me-2"></i> Exploitations
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'parcelles' %}active{% else %}text-secondary{% endif %}" href="{% url 'parcelles:parcelle_list' %}">
                <i class="bi bi-grid-3x2 me-2"></i> Parcelles
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'cultures' %}active{% else %}text-secondary{% endif %}" href="{% url 'cultures:liste' %}">
                <i class="bi bi-flower1 me-2"></i> Cultures
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'activites' %}active{% else %}text-secondary{% endif %}" href="{% url 'activites:liste' %}">
                <i class="bi bi-calendar-check me-2"></i> Activités
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'stock' %}active{% else %}text-secondary{% endif %}" href="{% url 'stock:liste_intrants' %}">
                <i class="bi bi-box2-fill me-2"></i> Stock
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'recoltes' %}active{% else %}text-secondary{% endif %}" href="{% url 'recoltes:recoltes_liste' %}">
                <i class="bi bi-bag-check me-2"></i> Récoltes
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'ventes' %}active{% else %}text-secondary{% endif %}" href="{% url 'ventes:liste' %}">
                <i class="bi bi-cash-coin me-2"></i> Ventes
            </a>
            <a class="nav-link rounded {% if request.resolver_match.app_name == 'finances' %}active{% else %}text-secondary{% endif %}" href="{% url 'finances:recettes' %}">
                <i class="bi bi-graph-up me-2"></i> Finances
            </a>
        </nav>

        <hr class="my-4">

        {% if user.is_staff %}
            <h6 class="text-uppercase text-muted small px-3">Administration</h6>
            <nav class="nav nav-pills flex-column gap-1 px-1">
                <a class="nav-link rounded {% if request.resolver_match.app_name == 'utilisateurs' %}active{% else %}text-secondary{% endif %}" href="{% url 'utilisateurs:liste' %}">
                    <i class="bi bi-person-badge me-2"></i> Utilisateurs
                </a>
                <a class="nav-link rounded text-secondary" href="/admin/">
                    <i class="bi bi-lock me-2"></i> Admin Django
                </a>
            </nav>
        {% endif %}
    </div>
</aside>
