{% extends 'base.html' %}
{% load static %}

<!-- Template: Utilisateurs - Register -->
<!-- Page d'inscription -->

{% block title %}Inscription - SmartFarm{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-5">
                <!-- Titre -->
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill" style="font-size: 2.5rem; color: #2d7d3a;"></i>
                    <h3 class="mt-2">Créer un compte</h3>
                    <p class="text-muted">Inscrivez-vous pour accéder à SmartFarm</p>
                </div>
                
                <!-- Formulaire d'Inscription -->
                <form method="POST" action="">
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">Prénom</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Nom</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password1" class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="password1" name="password1" required>
                        <small class="text-muted">Au minimum 8 caractères</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password2" class="form-label">Confirmer le mot de passe</label>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                        <label class="form-check-label" for="terms">
                            J'accepte les conditions d'utilisation
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 mb-2">
                        <i class="bi bi-check-circle"></i> S'inscrire
                    </button>
                </form>
                
                <hr class="my-3">
                <p class="text-center small">
                    Déjà inscrit ? <a href="#">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
